<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101418" />
  <title>Control Remoto</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    :root { --bg:#101418; --panel:#1a2027; --borde:#2b343d; --texto:#e8ecef; --suave:#8b97a3; --verde:#3ddc84; --rojo:#ff5c5c; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin:0; background:var(--bg); color:var(--texto); font-family:"Segoe UI",Roboto,Arial,sans-serif;
           padding:16px; padding-top:calc(16px + env(safe-area-inset-top,0px)); padding-bottom:calc(16px + env(safe-area-inset-bottom,0px)); }
    main { max-width:480px; margin:0 auto; }
    .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
    h1 { font-size:19px; margin:0; }
    .estado { display:flex; align-items:center; gap:7px; font-size:13px; color:var(--suave); }
    .punto { width:10px; height:10px; border-radius:50%; background:var(--rojo); box-shadow:0 0 6px var(--rojo); }
    .punto.ok { background:var(--verde); box-shadow:0 0 6px var(--verde); }
    .punto.conectando { background:#f5b942; box-shadow:0 0 6px #f5b942; }
    label { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--suave); margin:18px 0 8px; }
    .lista { background:var(--panel); border:1px solid var(--borde); border-radius:12px; overflow:hidden; }
    .vacio { color:var(--suave); font-size:14px; padding:16px; margin:0; text-align:center; }
    .pc { display:flex; align-items:center; gap:10px; padding:14px; border-bottom:1px solid var(--borde); font-size:16px; }
    .pc:last-child { border-bottom:none; }
    .pc.sel { background:#14301f; box-shadow:inset 3px 0 0 var(--verde); }
    .pc .txt { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .pc input { flex:1; min-width:0; }
    .icono-btn { background:none; border:none; color:var(--suave); font-size:18px; padding:6px 8px; width:auto; margin:0; }
    input[type="text"], input[type="url"] { width:100%; background:var(--panel); color:var(--texto); border:1px solid var(--borde);
           border-radius:12px; padding:14px; font-size:16px; outline:none; }
    input:focus { border-color:var(--verde); }
    button.principal { width:100%; margin-top:14px; padding:15px; font-size:17px; font-weight:600; border:none; border-radius:12px;
           background:var(--verde); color:#06210f; }
    button.principal:active { filter:brightness(.9); }
    button.principal:disabled { opacity:.45; }
    .secundario { width:100%; margin-top:10px; padding:11px; font-size:14px; border-radius:12px; background:none; color:var(--suave); border:1px solid var(--borde); }
    .msg { min-height:22px; margin-top:12px; font-size:14px; text-align:center; color:var(--suave); }
    .msg.ok { color:var(--verde); } .msg.err { color:var(--rojo); }
  </style>
</head>
<body>
<main>
  <div class="header">
    <h1>🎯 Control Remoto</h1>
    <div class="estado"><span id="punto" class="punto conectando"></span><span id="textoEstado">Conectando...</span></div>
  </div>

  <label>Enviar a</label>
  <div id="lista" class="lista"><p class="vacio">Buscando equipos...</p></div>
  <button id="btnRefrescar" class="secundario">↻ Refrescar lista</button>

  <label for="url">URL a abrir</label>
  <input type="url" id="url" placeholder="ej: youtube.com" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" />
  <button id="btnEnviar" class="principal">Enviar</button>
  <p id="msg" class="msg"></p>
</main>

<script>
  // El panel se conecta al WebSocket del mismo equipo que lo sirvió
  // (la PC del servidor), así no hay ninguna IP escrita acá.
  const WS_PORT = 8080;
  const NOMBRE_MOVIL = "Móvil";
  const WS_URL = `ws://${location.hostname}:${WS_PORT}`;

  const $ = (id) => document.getElementById(id);
  const punto = $("punto"), textoEstado = $("textoEstado"), lista = $("lista"), msg = $("msg");
  const urlInput = $("url"), btnEnviar = $("btnEnviar");

  let ws = null, clientes = [], idSel = null, idEdit = null;
  let espera = 1000, timerReconexion = null, timerPing = null, timerMsg = null;

  // Almacenamiento local (alias de las PCs). Puede fallar en modo privado: siempre con try/catch.
  function leer(clave, def) { try { return JSON.parse(localStorage.getItem(clave)) ?? def; } catch (e) { return def; } }
  function guardar(clave, val) { try { localStorage.setItem(clave, JSON.stringify(val)); } catch (e) {} }
  let alias = leer("aliasPCs", {});

  function mostrar(texto, tipo) {
    msg.textContent = texto; msg.className = "msg " + (tipo || "");
    clearTimeout(timerMsg);
    if (texto) timerMsg = setTimeout(() => (msg.textContent = ""), 3000);
  }

  function setEstado(e) {
    punto.className = "punto " + (e === "ok" ? "ok" : e === "conectando" ? "conectando" : "");
    textoEstado.textContent = e === "ok" ? "Servidor OK" : e === "conectando" ? "Conectando..." : "Sin conexión";
  }

  function enviarWS(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) { ws.send(JSON.stringify(obj)); return true; }
    return false;
  }

  function conectar() {
    if (!location.hostname) { setEstado("off"); mostrar("Abrí esta página desde la dirección http:// del servidor.", "err"); return; }
    if (ws && ws.readyState <= WebSocket.OPEN) return;
    clearTimeout(timerReconexion);
    setEstado("conectando");
    try { ws = new WebSocket(WS_URL); } catch (e) { programarReconexion(); return; }

    ws.onopen = () => {
      espera = 1000;
      setEstado("ok");
      enviarWS({ type: "register", role: "director", name: NOMBRE_MOVIL });
      clearInterval(timerPing);
      timerPing = setInterval(() => enviarWS({ type: "ping" }), 20000);
    };
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.type === "list") { clientes = m.clients || []; if (idEdit === null) render(); }
      else if (m.type === "sent") mostrar("✅ Orden enviada", "ok");
      else if (m.type === "error") mostrar("❌ " + (m.message || "Error"), "err");
    };
    ws.onclose = () => {
      clearInterval(timerPing);
      setEstado("off"); clientes = []; render(); programarReconexion();
    };
    ws.onerror = () => { try { ws.close(); } catch (e) {} };
  }

  function programarReconexion() {
    clearTimeout(timerReconexion);
    timerReconexion = setTimeout(conectar, espera);
    espera = Math.min(espera * 1.5, 8000);
  }

  function nombre(c) { return alias[c.id] || c.name || "(sin nombre)"; }

  function render() {
    lista.innerHTML = "";
    if (idSel && !clientes.some((c) => c.id === idSel)) idSel = null;
    if (!clientes.length) {
      lista.innerHTML = '<p class="vacio">No hay PCs receptoras conectadas.</p>';
      return;
    }
    clientes.forEach((c) => {
      const fila = document.createElement("div");
      fila.className = "pc" + (c.id === idSel ? " sel" : "");

      if (idEdit === c.id) {
        const inp = document.createElement("input");
        inp.type = "text"; inp.placeholder = "Nombre para esta PC"; inp.value = alias[c.id] || "";
        const ok = document.createElement("button");
        ok.className = "icono-btn"; ok.textContent = "✔";
        const fin = () => {
          const v = inp.value.trim();
          if (v) alias[c.id] = v; else delete alias[c.id];
          guardar("aliasPCs", alias); idEdit = null; render();
        };
        ok.onclick = (e) => { e.stopPropagation(); fin(); };
        inp.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); fin(); } };
        fila.append(inp, ok); lista.appendChild(fila);
        setTimeout(() => inp.focus(), 0);
        return;
      }

      const t = document.createElement("span"); t.className = "txt"; t.textContent = "🖥️ " + nombre(c);
      const ed = document.createElement("button"); ed.className = "icono-btn"; ed.textContent = "✏️";
      ed.onclick = (e) => { e.stopPropagation(); idEdit = c.id; render(); };
      fila.append(t, ed);
      fila.onclick = () => { idSel = c.id; render(); };
      lista.appendChild(fila);
    });
  }

  function enviar() {
    const url = urlInput.value.trim();
    if (!idSel) return mostrar("⚠️ Elegí una PC de la lista primero.", "err");
    if (!url) return mostrar("⚠️ Escribí una URL.", "err");
    if (!enviarWS({ type: "open_url", target_id: idSel, url })) return mostrar("❌ Sin conexión al servidor.", "err");
  }

  btnEnviar.onclick = enviar;
  urlInput.onkeydown = (e) => { if (e.key === "Enter") enviar(); };
  $("btnRefrescar").onclick = () => { enviarWS({ type: "list_request" }) || conectar(); mostrar("Actualizando lista..."); };

  // Al volver a la app (el móvil suele suspender la página) reconecta de inmediato
  document.addEventListener("visibilitychange", () => { if (!document.hidden) conectar(); });

  conectar();
</script>
</body>
</html>
